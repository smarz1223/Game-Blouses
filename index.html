<style>
:root{
  --plum:#3a1670; --plum-2:#2a0f55; --violet:#7b35d6; --lilac:#efe6fa; --lilac-2:#e2d2f6;
  --gold:#f4be1c; --gold-deep:#b98a00; --orange:#e9782a; --ink:#23173a; --muted:#6b5f80;
  --paper:#fbfafd; --card:#ffffff; --line:#e4dcef; --good:#2e9d57; --bad:#d9453d;
  --display:"Shrikhand", "Georgia", serif;
  --body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --cond:"Barlow Semi Condensed", "Arial Narrow", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom,0)}
a{color:var(--violet)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- header ---------- */
header.mast{background:var(--plum);color:#fff;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0)}
header.mast::before{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 12% 120%, rgba(123,53,214,.55) 0 38%, transparent 39%),
             radial-gradient(circle at 12% 120%, transparent 0 46%, rgba(244,190,28,.18) 46.5% 47.5%, transparent 48%);
  pointer-events:none}
.mast-in{position:relative;max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:18px 20px 14px}
.mast img{width:112px;height:112px;border-radius:50%;box-shadow:0 0 0 5px var(--violet),0 0 0 9px var(--plum-2);flex:none}
.mast h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,5.4vw,3.4rem);line-height:1;margin:0;letter-spacing:.5px}
.mast h1 .b{color:var(--gold)}
.mast p{margin:6px 0 0;color:#d9caf2;font-size:.95rem}
nav.tabs{background:var(--plum-2);position:sticky;top:0;z-index:20}
nav.tabs::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0);background:var(--plum-2)}
.tabs-in{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tabs a{flex:none;color:#e9def9;text-decoration:none;font-family:var(--cond);font-weight:600;font-size:1.02rem;
  padding:7px 14px;border-radius:999px;white-space:nowrap}
.tabs a:hover{background:rgba(255,255,255,.08)}
.tabs a.on{background:var(--gold);color:var(--plum-2)}

main{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
section.page{display:none}
section.page.on{display:block}
h2.pt{font-family:var(--display);font-weight:400;color:var(--plum);font-size:clamp(1.7rem,3.6vw,2.3rem);margin:4px 0 4px}
.lede{color:var(--muted);margin:0 0 18px;max-width:72ch}
h3{font-family:var(--cond);font-weight:700;font-size:1.25rem;margin:30px 0 10px;color:var(--plum)}
.note{color:var(--muted);font-size:.88rem;margin:6px 0 0}

/* ---------- panels ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.fact{background:var(--card);border-left:6px solid var(--violet);border-radius:10px;padding:12px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.fact.gold{border-left-color:var(--gold)}
.fact .k{font-size:.85rem;color:var(--muted)}
.fact .v{font-family:var(--cond);font-weight:700;font-size:1.45rem;line-height:1.15}
.fact .s{font-size:.85rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-family:var(--cond);font-size:.98rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid #f0eaf7}
th{background:var(--lilac);color:var(--plum);font-weight:700;position:sticky;top:0;cursor:pointer;user-select:none}
th.nosort{cursor:default}
th .ar{opacity:.45;font-size:.75em;margin-left:3px}
th.sorted .ar{opacity:1}
td.l,th.l{text-align:left}
td.c,th.c{text-align:center}
tbody tr:hover td{background:#faf6ff}
tr.cut td{border-bottom:3px solid var(--gold)}
td.own{font-weight:700}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--lilac);color:var(--plum)}
.chip.o{background:#fde3d0;color:#8a3a07}
.chip.g{background:#fff1c2;color:#6b5000}
.form{display:inline-flex;gap:3px}
.form i{width:16px;height:16px;border-radius:4px;font-style:normal;font-size:.7rem;line-height:16px;text-align:center;color:#fff;font-weight:700}
.form i.W{background:var(--good)} .form i.L{background:var(--bad)} .form i.T{background:var(--gold);color:var(--ink)}
.bar{position:relative;height:10px;background:#f0eaf7;border-radius:6px;min-width:90px}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--violet)}
.bar.mid::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted);opacity:.5}
.barcell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.barcell .bar{flex:1}

/* ---------- controls ---------- */
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--lilac);padding:4px;border-radius:999px}
.seg button{border:0;background:transparent;font-family:var(--cond);font-weight:600;font-size:.98rem;color:var(--plum);
  padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--plum);color:#fff}
.seg.own{border-radius:16px}
.seg .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0;box-shadow:0 0 0 1.5px #fff}
input[type=search]{font-family:var(--cond);font-weight:600;font-size:1rem;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);min-width:190px}
select{font-family:var(--cond);font-weight:600;font-size:1rem;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}

/* ---------- matchups ---------- */
.mups{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mup .row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-family:var(--cond);font-size:1.08rem;padding:3px 0}
.mup .row.win{font-weight:700}
.mup .row.win .pts{color:var(--good)}
.mup .row .pts{font-variant-numeric:tabular-nums}
.mup .sb{height:6px;border-radius:4px;background:#ece4f6;overflow:hidden;display:flex;margin-top:6px}
.mup .sb span{display:block;height:100%}
.mup .m{font-size:.82rem;color:var(--muted);margin-top:5px}

/* ---------- heat cells ---------- */
td.heat{font-weight:600}
td.hi{box-shadow:inset 0 0 0 2px var(--gold)}
.legend-key{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:8px}
.legend-key span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* ---------- draft board ---------- */
.board{display:grid;gap:4px;min-width:1010px}
.board .h{font-family:var(--cond);font-weight:700;color:var(--plum);text-align:center;font-size:.92rem;padding:4px 2px}
.board .rd{font-family:var(--cond);font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center}
.pick{border-radius:8px;padding:5px 5px;font-family:var(--cond);font-size:.84rem;line-height:1.2;border:1px solid var(--line);background:#fff}
.pick b{display:block;font-size:.76rem;letter-spacing:-.1px;line-height:1.15;overflow-wrap:break-word;hyphens:manual}
.pick small{color:var(--muted)}

/* ---------- history ---------- */
.medal{display:inline-block;width:18px;height:18px;border-radius:50%;font-size:.7rem;line-height:18px;text-align:center;font-weight:700;margin-left:4px;vertical-align:1px}
.medal.m1{background:var(--gold);color:var(--plum-2)} .medal.m2{background:#cfc8dc;color:var(--ink)} .medal.m3{background:#e9a46f;color:#3a1a00}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.award{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.award .k{color:var(--muted);font-size:.88rem}
.award .v{font-family:var(--display);color:var(--plum);font-size:1.5rem;line-height:1.2;margin:2px 0}
.award .w{font-family:var(--cond);font-weight:700}

/* ---------- rules ---------- */
.rules dl{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:0;margin:0}
.rules dt,.rules dd{padding:8px 10px;border-bottom:1px solid #f0eaf7;margin:0}
.rules dt{color:var(--muted)}
.rules dd{font-weight:600}
.pay{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.pay .amt{font-family:var(--display);font-size:2rem;color:var(--plum);line-height:1.1}

.chartbox{position:relative;height:340px}
.chartbox.tall{height:420px}
details.chk{margin-top:26px}
details.chk summary{cursor:pointer;color:var(--muted);font-weight:600}
footer{max-width:1180px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:.85rem}
.empty{padding:22px;text-align:center;color:var(--muted)}
@media (max-width:640px){
  .mast img{width:78px;height:78px}
  .mast-in{gap:14px;padding:14px 14px 12px}
  .rules dl{grid-template-columns:1fr}
  .rules dt{border-bottom:0;padding-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
(function(){
"use strict";
const D = DATA, M = D.meta;
const OWNERS = D.owners;
const PALETTE = ["#7b35d6","#f4be1c","#e9782a","#2f8f83","#c2185b","#3d5afe","#8d6e00","#5d4037","#00a0c6","#9e9e9e"];
const OC = {}; OWNERS.forEach((o,i)=>OC[o]=PALETTE[i%PALETTE.length]);
const GROUP_C = {Center:"#7b35d6",Forward:"#f4be1c",Guard:"#e9782a"};
const CAT_C = {PTS:"#7b35d6",REB:"#2f8f83",AST:"#f4be1c",ST:"#e9782a",BLK:"#3d5afe",TO:"#9e9e9e"};
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f1 = v => (v==null||isNaN(v))?"":Number(v).toLocaleString(undefined,{minimumFractionDigits:1,maximumFractionDigits:1});
const f0 = v => (v==null||isNaN(v))?"":Number(v).toLocaleString(undefined,{maximumFractionDigits:0});
const pct = v => (v==null)?"":(v===1?"1.000":Number(v).toFixed(3).replace(/^0/,""));
const sgn = v => (v>0?"+":"")+f1(v);
const money = v => "$"+Number(v).toLocaleString();
const rec = s => s.w+"-"+s.l+(s.t?"-"+s.t:"");
const charts = {};
// conditional formatting: green = good, red = bad, white = neutral. v is -1..1
const GOOD="#2e9d57", BAD="#d9453d";
const cf = v => { v=Math.max(-1,Math.min(1,v)); return v===0?"transparent":(v>0?hex2rgba(GOOD,.62*v):hex2rgba(BAD,.62*-v)); };

/* ---------------- sortable tables ---------------- */
const TABLES = {};
let TID = 0;
// cols: {k, label, cls, fmt(row)->html, sort(row)->value, nosort}
function table(cols, rows, opt){
  opt = opt||{};
  const id = "t"+(TID++);
  TABLES[id] = {cols, rows:rows.slice(), opt, sortK:opt.sortK==null?null:opt.sortK, dir:opt.dir||-1};
  if(opt.sortK!=null) applySort(TABLES[id]);
  return `<div class="tw"><table id="${id}">${thead(id)}<tbody>${tbody(id)}</tbody></table></div>`;
}
function thead(id){
  const T = TABLES[id];
  return "<thead><tr>"+T.cols.map((c,i)=>`<th data-i="${i}" class="${c.cls||""} ${c.nosort?"nosort":""} ${T.sortK===i?"sorted":""}" ${c.nosort?"":'tabindex="0"'} scope="col">${c.label}${c.nosort?"":`<span class="ar">${T.sortK===i?(T.dir<0?"▼":"▲"):"↕"}</span>`}</th>`).join("")+"</tr></thead>";
}
function tbody(id){
  const T = TABLES[id];
  const cut = T.opt.rowCls && (T.origK===undefined || (T.sortK===T.origK && T.dir===T.origDir));
  return T.rows.map(r=>`<tr class="${cut?T.opt.rowCls(r):""}">`+T.cols.map(c=>`<td class="${c.cls||""}" ${c.style?`style="${c.style(r)}"`:""}>${c.fmt?c.fmt(r):esc(r[c.k])}</td>`).join("")+"</tr>").join("")
    || `<tr><td colspan="${T.cols.length}" class="empty">No data yet.</td></tr>`;
}
function sortTable(id, i){
  const T = TABLES[id], c = T.cols[i];
  if(c.nosort) return;
  if(T.origK===undefined){T.origK=T.opt.sortK; T.origDir=T.opt.dir;}
  T.dir = (T.sortK===i) ? -T.dir : (c.asc?1:-1);
  T.sortK = i;
  applySort(T);
  const el = document.getElementById(id);
  el.innerHTML = thead(id)+"<tbody>"+tbody(id)+"</tbody>";
}
function applySort(T){
  const c = T.cols[T.sortK]; if(!c) return;
  const key = c.sort || (r=>r[c.k]);
  T.rows.sort((a,b)=>{const x=key(a),y=key(b);
    if(typeof x==="string"||typeof y==="string") return T.dir*String(x).localeCompare(String(y));
    return T.dir*((x??-1e9)-(y??-1e9));});
}
document.addEventListener("click",e=>{const th=e.target.closest("th[data-i]");if(th) sortTable(th.closest("table").id,+th.dataset.i);});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){const th=e.target.closest&&e.target.closest("th[data-i]");if(th) sortTable(th.closest("table").id,+th.dataset.i);}});

/* ---------------- charts ---------------- */
Chart.defaults.font.family = '"Barlow Semi Condensed", sans-serif';
Chart.defaults.font.size = 13;
Chart.defaults.color = "#6b5f80";
function hex2rgba(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
// legend click: highlight one series, grey the rest; click again to reset
function highlightLegend(after){
  return {position:"bottom",labels:{usePointStyle:true,boxWidth:8},
    onClick:(e,item,legend)=>{
      const ch = legend.chart, i = item.datasetIndex;
      ch._hl = (ch._hl===i)?null:i;
      ch.data.datasets.forEach((ds,j)=>{
        const base = ds._base || (ds._base = {b:ds.borderColor,g:ds.backgroundColor,w:ds.borderWidth});
        const on = ch._hl==null || ch._hl===j;
        ds.borderColor = on?base.b:"rgba(160,150,180,.25)";
        ds.backgroundColor = on?base.g:"rgba(160,150,180,.18)";
        ds.borderWidth = (ch._hl===j && base.w)?4:base.w;
        ds.order = (ch._hl===j)?-1:0;
      });
      if(after) after(ch); else ch.update();
    }};
}
function orderStack(ch){
  const rows = ch._rows.slice();
  const key = r => ch._hl==null ? r.vals.reduce((a,b)=>a+b,0) : r.vals[ch._hl];
  rows.sort((a,b)=>key(b)-key(a));
  ch.data.labels = rows.map(r=>r.label);
  ch.data.datasets.forEach((d,j)=>{ d.data = rows.map(r=>r.vals[j]); });
  ch.update();
}
function stackChart(id, rows, series, title){
  mkChart(id,{type:"bar",data:{labels:[],datasets:series.map(s=>({label:s.label,data:[],backgroundColor:s.color,borderColor:s.color,borderWidth:0}))},
    options:{maintainAspectRatio:false,indexAxis:"y",scales:{x:{stacked:true,title:{display:true,text:title}},y:{stacked:true}},plugins:{legend:highlightLegend(orderStack)}}});
  const ch = charts[id]; if(!ch) return;
  ch._rows = rows; orderStack(ch);
}
function mkChart(id,cfg){ if(charts[id]) charts[id].destroy(); const el=document.getElementById(id); if(!el) return; charts[id]=new Chart(el,cfg); }

/* ---------------- shell ---------------- */
const PAGES = [
  ["standings","Standings"],["weekly","Weekly"],["categories","Stat Categories"],["positions","Positions"],
  ["teams","Teams"],["players","Players"],["draft","Draft"],["history","League History"],["rules","Rules"]
];
document.getElementById("sub").textContent = `Fantasy basketball, ${M.season} season. Updated ${M.updated}.`;
document.getElementById("tabs").innerHTML = PAGES.map(([k,l])=>`<a href="#${k}" data-p="${k}">${l}</a>`).join("");
document.getElementById("main").innerHTML = PAGES.map(([k])=>`<section class="page" id="p-${k}"></section>`).join("");
document.getElementById("foot").innerHTML = `Data from the league's Yahoo stats via Google Sheets, refreshed every morning. Part of <a href="https://redplanetanalytics.com">Red Planet Analytics</a>.`;
const RENDER = {standings:rStandings,weekly:rWeekly,categories:rCategories,positions:rPositions,teams:rTeams,players:rPlayers,draft:rDraft,history:rHistory,rules:rRules};
const done = {};
function go(){
  let k = (location.hash||"#standings").slice(1).split("-")[0];
  if(!RENDER[k]) k="standings";
  document.querySelectorAll("section.page").forEach(s=>s.classList.toggle("on",s.id==="p-"+k));
  document.querySelectorAll(".tabs a").forEach(a=>{a.classList.toggle("on",a.dataset.p===k); if(a.dataset.p===k) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");});
  if(!done[k]){ RENDER[k](document.getElementById("p-"+k)); done[k]=true; }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",go);

const S = D.standings;
const played = M.reg_played;
const wkLabel = w => (w>M.reg_weeks?"Playoffs wk ":"Week ")+w;

/* ================= STANDINGS ================= */
function rStandings(el){
  const lead = S[0];
  const pf = S.slice().sort((a,b)=>b.pf-a.pf)[0];
  el.innerHTML = `
  <h2 class="pt">Standings</h2>
  <p class="lede">${played?`Through week ${played} of ${M.reg_weeks}. Top ${M.playoff_teams} make the playoffs (weeks ${M.playoff_weeks.join(" and ")}). Best record wins the ${money(D.payouts.find(p=>p.label==="Regular season").amount)} regular season prize, with Points For as the tiebreaker.`:"The season has not started yet."}</p>
  <div class="strip">
    <div class="fact gold"><div class="k">Regular season leader</div><div class="v">${esc(lead.owner)}</div><div class="s">${rec(lead)}, ${f1(lead.pf)} PF</div></div>
    <div class="fact"><div class="k">Most points scored</div><div class="v">${esc(pf.owner)}</div><div class="s">${f1(pf.pf)} PF, ${f1(pf.avg)} per week</div></div>
    <div class="fact"><div class="k">Weeks played</div><div class="v">${played} of ${M.reg_weeks}</div><div class="s">${M.reg_weeks-played} regular season weeks left</div></div>
    <div class="fact"><div class="k">Prize pool</div><div class="v">${money(M.pot)}</div><div class="s">${M.teams} teams at ${money(M.fee)}</div></div>
  </div>
  ${table([
    {k:"seed",label:"Seed",cls:"c",asc:true},
    {k:"owner",label:"Owner",cls:"l own",asc:true},
    {label:"Record",cls:"c",fmt:rec,sort:r=>r.wpct},
    {k:"wpct",label:"Win %",fmt:r=>pct(r.wpct)},
    {k:"gb",label:"GB",fmt:r=>r.gb?f1(r.gb):"–",asc:true},
    {k:"pf",label:"PF",fmt:r=>f1(r.pf)},
    {k:"pa",label:"PA",fmt:r=>f1(r.pa)},
    {k:"diff",label:"Diff",fmt:r=>sgn(r.diff)},
    {k:"avg",label:"PF / Wk",fmt:r=>f1(r.avg)},
    {k:"streak",label:"Streak",cls:"c",nosort:true},
    {label:"Last 5",cls:"c",nosort:true,fmt:r=>`<span class="form">${r.form.map(x=>`<i class="${x}">${x}</i>`).join("")}</span>`}
  ], S, {sortK:0,dir:1,rowCls:r=>r.seed===M.playoff_teams?"cut":""})}
  <p class="note">Gold line marks the playoff cut. Click any column header to sort.</p>

  <h3>Luck and strength</h3>
  <p class="lede">All-play pretends every team played everyone each week. Expected wins come from that all-play rate. Luck above 50 means a team has won more than its scores deserve. Performance rates average weekly scoring against the league on a 0 to 100 scale.</p>
  ${table([
    {k:"owner",label:"Owner",cls:"l own",asc:true},
    {label:"Record",cls:"c",fmt:rec,sort:r=>r.wpct},
    {label:"All-play",cls:"c",fmt:r=>r.ap_w+"-"+r.ap_l+(r.ap_t?"-"+r.ap_t:""),sort:r=>r.ap_pct},
    {k:"ap_pct",label:"All-play %",fmt:r=>pct(r.ap_pct)},
    {k:"xw",label:"Exp. W",fmt:r=>f1(r.xw)},
    {label:"Wins vs exp.",fmt:r=>sgn(r.w+0.5*r.t-r.xw),sort:r=>r.w+0.5*r.t-r.xw},
    {k:"luck",label:"Luck",fmt:r=>`<div class="barcell">${f0(r.luck)}<div class="bar mid"><span style="width:${r.luck}%;background:${r.luck>=50?"var(--good)":"var(--bad)"}"></span></div></div>`},
    {k:"perf",label:"Performance",fmt:r=>`<div class="barcell">${f0(r.perf)}<div class="bar"><span style="width:${r.perf}%"></span></div></div>`},
    {k:"high",label:"Top score wks"},
    {k:"low",label:"Low score wks"}
  ], S.slice().sort((a,b)=>b.perf-a.perf), {sortK:7,dir:-1})}

  <h3>Standings rank by week</h3>
  <div class="panel"><div class="chartbox"><canvas id="c-rank"></canvas></div><p class="note">Rank is based on the cumulative record each week, with Points For as the tiebreaker. Click an owner in the legend to highlight them.</p></div>

  <details class="chk"><summary>Data check</summary>
  <p class="note">Each owner's game log total compared with their entered weekly scores. The game log refreshes daily and can include games from the week in progress, so small gaps mid-week are expected.</p>
  ${table([
    {k:"owner",label:"Owner",cls:"l own",asc:true},
    {k:"players",label:"Game log FP",fmt:r=>f1(r.players)},
    {k:"weekly",label:"Weekly scores",fmt:r=>f1(r.weekly)},
    {k:"diff",label:"Gap",fmt:r=>r.diff?sgn(r.diff):"0.0"}
  ], D.recon)}
  ${D.flags.length?`<ul class="note">${D.flags.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
  </details>`;
  // cumulative rank chart
  const weeks = D.weekly.filter(w=>!w.playoff).map(w=>w.week);
  const cum = {}; OWNERS.forEach(o=>cum[o]={w:0,t:0,pf:0});
  const ranks = {}; OWNERS.forEach(o=>ranks[o]=[]);
  weeks.forEach(wk=>{
    D.results.filter(r=>r.week===wk).forEach(r=>{cum[r.owner].w+=r.res==="W"?1:0;cum[r.owner].t+=r.res==="T"?1:0;cum[r.owner].pf+=r.pf;});
    const order = OWNERS.slice().sort((a,b)=>(cum[b].w+.5*cum[b].t)-(cum[a].w+.5*cum[a].t)||cum[b].pf-cum[a].pf);
    order.forEach((o,i)=>ranks[o].push(i+1));
  });
  mkChart("c-rank",{type:"line",data:{labels:weeks.map(w=>"Wk "+w),datasets:OWNERS.map(o=>({label:o,data:ranks[o],borderColor:OC[o],backgroundColor:OC[o],borderWidth:2.5,tension:.25,pointRadius:4}))},
    options:{maintainAspectRatio:false,scales:{y:{reverse:true,min:1,max:OWNERS.length,ticks:{stepSize:1},title:{display:true,text:"Rank"}}},plugins:{legend:highlightLegend()}}});
}

/* ================= WEEKLY ================= */
function rWeekly(el){
  const W = D.weekly;
  if(!W.length){ el.innerHTML = `<h2 class="pt">Weekly</h2><p class="empty">No weeks entered yet. Scores appear here once a full week is entered in the Weekly Scores tab.</p>`; return; }

  <p class="lede">Matchups, scores, and who topped the league each week.</p>
  <div class="ctl"><label for="wk-sel" class="note" style="margin:0">Week</label><select id="wk-sel">${W.map(w=>`<option value="${w.week}">${wkLabel(w.week)}</option>`).join("")}</select></div>

      .concat([{k:"avg",label:"Avg",fmt:r=>f1(r.avg)}]), rows, {sortK:W.length+1,dir:-1});

  mkChart("c-weekly",{type:"line",data:{labels:W.map(w=>(w.playoff?"P":"Wk ")+w.week),datasets:ds},options:{maintainAspectRatio:false,plugins:{legend:highlightLegend()},scales:{y:{title:{display:true,text:"Fantasy points"}}}}});

/* ================= PLAYERS ================= */
function rPlayers(el){
  const ALL = D.players, K = D.stat_keys;
  if(!ALL.length){ el.innerHTML = `<h2 class="pt">Players</h2><p class="empty">No players have scored yet.</p>`; return; }
  const posList = [...new Set(ALL.map(p=>p.pos))].sort((a,b)=>a.split(",").length-b.split(",").length||a.localeCompare(b));
  const maxGP = Math.max(...ALL.map(p=>p.gp));
  const mins = [1].concat([3,5,10,20,40].filter(n=>n<=maxGP));
  const avgFP = ALL.reduce((a,p)=>a+p.fp,0)/ALL.length, avgFPG = ALL.reduce((a,p)=>a+p.fpg,0)/ALL.length;
  const norm = s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  const st = {owners:new Set(), pos:new Set(), min:1, q:""};
  const match = p => (!st.owners.size||st.owners.has(p.owner)) && (!st.pos.size||st.pos.has(p.pos)) && p.gp>=st.min && (!st.q||norm(p.player).includes(st.q));
  el.innerHTML = `
  <h2 class="pt">Players</h2>
  <p class="lede">Every player on any owner's game log this season. Dot size shows games played, and dot color matches the owner buttons. Filters grey out dots on the chart and remove rows from the table.</p>
  <div class="ctl"><div class="seg own" id="pl-own" role="group" aria-label="Owner filter"><button data-o="" class="on">All owners</button>${OWNERS.map(o=>`<button data-o="${esc(o)}"><i class="dot" style="background:${OC[o]}"></i>${esc(o)}</button>`).join("")}</div></div>
  <div class="ctl">
    <div class="seg" id="pl-pos" role="group" aria-label="Eligibility filter"><button data-p="" class="on">All positions</button>${posList.map(x=>`<button data-p="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    ${mins.length>1?`<div class="seg" id="pl-min" role="group" aria-label="Minimum games">${mins.map((n,i)=>`<button data-n="${n}" class="${i?"":"on"}">${i?n+"+ games":"Any games"}</button>`).join("")}</div>`:""}
    <input id="pl-q" type="search" placeholder="Search player" aria-label="Search player">
  </div>
  <p class="note" id="pl-count" style="margin:0 0 10px"></p>
  <div class="panel"><div class="chartbox tall"><canvas id="c-players"></canvas></div>
  <p class="note">Dashed lines are the player averages (${f0(avgFP)} total FP, ${f1(avgFPG)} per game). Top right is volume plus output; top left is big per-game output on fewer games. Hover a dot for the stat line.</p></div>
  <div id="pl-table"></div>`;
  const rad = p => 5+8*Math.sqrt(p.gp/maxGP);
  const plot = () => { const on=ALL.filter(match), off=ALL.filter(p=>!match(p));
    return off.map(p=>({x:p.fp,y:p.fpg,p,on:false})).concat(on.map(p=>({x:p.fp,y:p.fpg,p,on:true}))); };
  const plug = {id:"plAvg",afterDatasetsDraw(ch){
    const {ctx,chartArea:a,scales:{x,y}} = ch;
    ctx.save();
    const xp=x.getPixelForValue(avgFP), yp=y.getPixelForValue(avgFPG);
    ctx.setLineDash([5,4]); ctx.strokeStyle="rgba(35,23,58,.35)"; ctx.lineWidth=1.5;
    if(xp>=a.left&&xp<=a.right){ctx.beginPath();ctx.moveTo(xp,a.top);ctx.lineTo(xp,a.bottom);ctx.stroke();}
    if(yp>=a.top&&yp<=a.bottom){ctx.beginPath();ctx.moveTo(a.left,yp);ctx.lineTo(a.right,yp);ctx.stroke();}
    ctx.setLineDash([]); ctx.fillStyle="#6b5f80"; ctx.font='600 12px "Barlow Semi Condensed", sans-serif'; ctx.textBaseline="alphabetic";
    if(xp>=a.left&&xp<=a.right){ctx.textAlign="left";ctx.fillText("Avg "+f0(avgFP)+" FP",xp+4,a.top+12);}
    if(yp>=a.top&&yp<=a.bottom){ctx.textAlign="right";ctx.fillText("Avg "+f1(avgFPG)+" per game",a.right-4,yp-4);}
    // name labels: top totals and top per-game among highlighted dots, skipping overlaps
    const pts=ch.data.datasets[0].data, meta=ch.getDatasetMeta(0);
    const on=pts.map((d,i)=>({d,i})).filter(o=>o.d.on);
    const pick=new Set();
    if(on.length<=12) on.forEach(o=>pick.add(o.i));
    else{ on.slice().sort((q,r)=>r.d.x-q.d.x).slice(0,6).forEach(o=>pick.add(o.i)); on.slice().sort((q,r)=>r.d.y-q.d.y).slice(0,3).forEach(o=>pick.add(o.i)); }
    const boxes=[]; ctx.font='600 12px "Barlow Semi Condensed", sans-serif'; ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.lineJoin="round";
    pick.forEach(i=>{ const e=meta.data[i]; if(!e) return; const t=pts[i].p.player, w=ctx.measureText(t).width, r0=(e.options&&e.options.radius)||8;
      let tx=e.x+r0+4; if(tx+w>a.right) tx=e.x-r0-4-w;
      const b={x:tx,y:e.y-7,w:w,h:14};
      if(boxes.some(o=>!(b.x>o.x+o.w||b.x+b.w<o.x||b.y>o.y+o.h||b.y+b.h<o.y))) return;
      boxes.push(b); ctx.lineWidth=3; ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.strokeText(t,tx,e.y); ctx.fillStyle="#23173a"; ctx.fillText(t,tx,e.y); });
    ctx.restore(); }};
  mkChart("c-players",{type:"scatter",plugins:[plug],
    data:{datasets:[{data:plot(),
      pointBackgroundColor:c=>c.raw&&c.raw.on?hex2rgba(OC[c.raw.p.owner],.92):"rgba(160,150,180,.28)",
      pointBorderColor:c=>c.raw&&c.raw.on?"#fff":"rgba(160,150,180,.35)",
      pointBorderWidth:1.5,
      pointRadius:c=>c.raw?rad(c.raw.p):6, pointHoverRadius:c=>c.raw?rad(c.raw.p)+2:8}]},
    options:{maintainAspectRatio:false,
      scales:{x:{grace:"5%",title:{display:true,text:"Total fantasy points"}},y:{grace:"5%",title:{display:true,text:"Fantasy points per game"}}},
      plugins:{legend:{display:false},tooltip:{callbacks:{
        title:i=>i[0].raw.p.player,
        label:i=>{const p=i.raw.p; return [`${p.owner}, ${p.pos}, ${p.nba}`,`${p.gp} GP, ${f1(p.fp)} FP, ${f1(p.fpg)} per game`,K.map(k=>k+" "+p.stats[k]).join(", ")];}}}}}});
  let lastT=null;
  const sync = ()=>{
    const rows = ALL.filter(match);
    document.querySelectorAll("#pl-own button").forEach(b=>b.classList.toggle("on",b.dataset.o?st.owners.has(b.dataset.o):!st.owners.size));
    document.querySelectorAll("#pl-pos button").forEach(b=>b.classList.toggle("on",b.dataset.p?st.pos.has(b.dataset.p):!st.pos.size));
    document.querySelectorAll("#pl-min button").forEach(b=>b.classList.toggle("on",+b.dataset.n===st.min));
    document.getElementById("pl-count").textContent = `Showing ${rows.length} of ${ALL.length} players`;
    const ch = charts["c-players"]; if(ch){ ch.data.datasets[0].data = plot(); ch.update(); }
    const prev = lastT && TABLES[lastT];
    if(!rows.length){ document.getElementById("pl-table").innerHTML = `<p class="empty">No players match these filters.</p>`; lastT=null; return; }
    const cols = [{k:"player",label:"Player",cls:"l",asc:true},
      {k:"owner",label:"Owner",cls:"l own",asc:true,fmt:r=>`<i class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:${OC[r.owner]}"></i>${esc(r.owner)}`},
      {k:"nba",label:"NBA",cls:"c"},{k:"pos",label:"Elig.",cls:"c"},{k:"gp",label:"GP"}]
      .concat(K.map(k=>({label:k,sort:r=>r.stats[k],fmt:r=>r.stats[k]})))
      .concat([{k:"fp",label:"FP",fmt:r=>f1(r.fp)},{k:"fpg",label:"FP / G",fmt:r=>f1(r.fpg)},
        {label:"Draft pick",cls:"c",asc:true,sort:r=>r.draft_pick==null?9999:r.draft_pick,fmt:r=>r.draft_pick!=null?"#"+r.draft_pick:(D.draft?"Added":"")}]);
    document.getElementById("pl-table").innerHTML = table(cols, rows, {sortK:prev?prev.sortK:5+K.length, dir:prev?prev.dir:-1});
    lastT = "t"+(TID-1);
  };
  const multi = (id,attr,set) => document.getElementById(id).addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return; const v=b.dataset[attr];
    if(!v) set.clear(); else if(set.has(v)) set.delete(v); else set.add(v); sync(); });
  multi("pl-own","o",st.owners); multi("pl-pos","p",st.pos);
  const mn = document.getElementById("pl-min"); if(mn) mn.addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; st.min=+b.dataset.n; sync();});
  document.getElementById("pl-q").addEventListener("input",e=>{ st.q=norm(e.target.value.trim()); sync(); });
  sync();
}

/* ================= DRAFT ================= */
function rDraft(el){
  const DR = D.draft;
  if(!DR){ el.innerHTML = `<h2 class="pt">Draft</h2><p class="empty">Draft results are not loaded.</p>`; return; }
  el.innerHTML = `
  <h2 class="pt">Draft</h2>
  <p class="lede">The ${M.season} draft, ${DR.rounds} rounds, and how each pick is producing. Value compares where a player was taken among his position group with where he ranks now by fantasy points. Players who have not played share the last rank in their group.</p>
  <div class="ctl"><div class="seg" id="dr-v"><button class="on" data-v="board">Full board</button><button data-v="team">By team</button><button data-v="best">Best and worst</button><button data-v="pos">By position</button><button data-v="adds">Added players</button></div></div>
  <div id="dr-box"></div>`;
  const valColor = v => v===0?"#fff":cf(Math.sign(v)*Math.min(1,.15+Math.abs(v)/12));
  const valCol = {k:"value",label:"Value",fmt:r=>r.value>0?"+"+r.value:r.value,style:r=>`background:${valColor(r.value)}`};
  const views = {
    board(){
      const cols = DR.order.length;
      let h = `<div class="tw" style="padding:8px"><div class="board" style="grid-template-columns:42px repeat(${cols},minmax(0,1fr))"><div></div>${DR.order.map(o=>`<div class="h">${esc(o)}</div>`).join("")}`;
      for(let rd=1; rd<=DR.rounds; rd++){
        h += `<div class="rd">R${rd}</div>`;
        DR.order.forEach(o=>{
          const p = DR.picks.find(x=>x.round===rd&&x.owner===o);
          h += p?`<div class="pick" style="background:${valColor(p.value)}" title="${esc(p.player)}: drafted ${p.group} #${p.draft_pos_rank}, now #${p.cur_pos_rank}"><b>${esc(p.player)}</b><small>#${p.pick} ${esc(p.pos)}, ${f1(p.fp)} FP</small></div>`:`<div></div>`;
        });
      }
      return h+`</div></div><div class="legend-key"><span style="--c:${hex2rgba(GOOD,.5)}">Outperforming draft slot</span><span style="--c:${hex2rgba(BAD,.5)}">Underperforming draft slot</span></div>`;
    },
    team(){
      return `<div class="ctl"><div class="seg own" id="dr-own" role="group" aria-label="Owner">${ownerBtns()}</div></div><div id="dr-tm"></div>`;
    },
    best(){
      const sorted = DR.picks.slice().sort((a,b)=>b.value-a.value);
      return `${table([{k:"owner",label:"Owner",cls:"l own",asc:true},{k:"draft_fp",label:"FP from own picks",fmt:r=>f1(r.draft_fp)},{k:"other_fp",label:"FP from added players",fmt:r=>f1(r.other_fp)},{k:"producing",label:"Picks producing"},{k:"hits",label:"Hits"},{k:"misses",label:"Misses"},{k:"avg_value",label:"Avg value",fmt:r=>(r.avg_value>0?"+":"")+r.avg_value}], DR.summary, {sortK:1,dir:-1})}
      <p class="note">Hits are picks ranking higher in their position group than where they were drafted; misses rank lower.</p>
      <div class="grid2">
        <div><h3>Best value</h3>${table([{k:"pick",label:"Pick",cls:"c",asc:true},{k:"player",label:"Player",cls:"l",asc:true},{k:"owner",label:"Owner",cls:"l own",asc:true},{k:"fp",label:"FP",fmt:r=>f1(r.fp)},valCol], sorted.slice(0,10), {sortK:4,dir:-1})}</div>
        <div><h3>Worst value</h3>${table([{k:"pick",label:"Pick",cls:"c",asc:true},{k:"player",label:"Player",cls:"l",asc:true},{k:"owner",label:"Owner",cls:"l own",asc:true},{k:"fp",label:"FP",fmt:r=>f1(r.fp)},valCol], sorted.slice(-10).reverse(), {sortK:4,dir:1})}</div>
      </div>
      <h3>Draft slot vs production</h3>
      <div class="panel"><div class="chartbox tall"><canvas id="c-draft"></canvas></div><p class="note">Each dot is a pick. Click an owner in the legend to highlight their picks.</p></div>`;
    },
    pos(){
      return `<div class="ctl"><div class="seg" id="dr-g">${D.positions.order.map((g,i)=>`<button data-g="${g}" class="${i?"":"on"}">${g}</button>`).join("")}</div></div><div id="dr-pos"></div>`;
    },
    adds(){
      return `<p class="lede">Players nobody drafted who have scored for a team, sorted by fantasy points.</p>`+table([{k:"player",label:"Player",cls:"l",asc:true},{k:"owner",label:"Owner",cls:"l own",asc:true},{k:"nba",label:"NBA",cls:"c"},{k:"pos",label:"Elig.",cls:"c"},{k:"gp",label:"GP"},{k:"fp",label:"FP",fmt:r=>f1(r.fp)}], DR.adds, {sortK:5,dir:-1});
    }
  };
  const show = v => {
    document.getElementById("dr-box").innerHTML = views[v]();
    if(v==="team"){
      const t = o=>document.getElementById("dr-tm").innerHTML = table([{k:"round",label:"Rd",cls:"c",asc:true},{k:"pick",label:"Pick",cls:"c",asc:true},{k:"player",label:"Player",cls:"l",asc:true},{k:"pos",label:"Elig.",cls:"c"},{k:"gp",label:"GP"},{k:"fp_for_owner",label:"FP for team",fmt:r=>f1(r.fp_for_owner)},{label:"Drafted",cls:"c",sort:r=>r.draft_pos_rank,fmt:r=>`${r.group} #${r.draft_pos_rank}`},{label:"Now",cls:"c",sort:r=>r.cur_pos_rank,fmt:r=>`${r.group} #${r.cur_pos_rank}`},valCol], DR.picks.filter(p=>p.owner===o), {sortK:1,dir:1});
      segWire("dr-own","o",t); t(OWNERS[0]);
    }
    if(v==="pos"){
      const t = g => document.getElementById("dr-pos").innerHTML = table([{label:"Drafted",cls:"c",sort:r=>r.draft_pos_rank,asc:true,fmt:r=>`${g} #${r.draft_pos_rank}`},{k:"pick",label:"Pick",cls:"c",asc:true},{k:"player",label:"Player",cls:"l",asc:true},{k:"owner",label:"Owner",cls:"l own",asc:true},{k:"fp",label:"FP",fmt:r=>f1(r.fp)},{label:"Now",cls:"c",sort:r=>r.cur_pos_rank,asc:true,fmt:r=>`${g} #${r.cur_pos_rank}`},valCol], DR.picks.filter(p=>p.group===g), {sortK:0,dir:1});
      segWire("dr-g","g",t); t(D.positions.order[0]);
    }
    if(v==="best"){
      mkChart("c-draft",{type:"scatter",data:{datasets:OWNERS.map(o=>({label:o,data:DR.picks.filter(p=>p.owner===o).map(p=>({x:p.pick,y:p.fp,n:p.player})),backgroundColor:OC[o],borderColor:OC[o],pointRadius:6,pointHoverRadius:8}))},
        options:{maintainAspectRatio:false,scales:{x:{title:{display:true,text:"Overall pick"},min:0,max:DR.picks.length+1},y:{title:{display:true,text:"Fantasy points"},beginAtZero:true}},
          plugins:{legend:highlightLegend(),tooltip:{callbacks:{label:c=>`${c.raw.n} (${c.dataset.label}): pick ${c.raw.x}, ${f1(c.raw.y)} FP`}}}}});
    }
  };
  segWire("dr-v","v",show); show("board");
}

/* ================= HISTORY ================= */
function rHistory(el){
  const H = D.history;
  if(!H){ el.innerHTML = `<h2 class="pt">League History</h2><p class="empty">History workbook could not be loaded.</p>`; return; }
  const yrs = H.years;
  const medal = c => c.first?`<span class="medal m1" title="Champion">1</span>`:c.second?`<span class="medal m2" title="Runner-up">2</span>`:c.third?`<span class="medal m3" title="Third place">3</span>`:"";
  el.innerHTML = `
  <h2 class="pt">League History</h2>
  <p class="lede">${yrs.length} completed seasons, ${H.labels[yrs[0]]} through ${H.labels[yrs[yrs.length-1]]}. Season records are regular season wins and losses; points history is not tracked.</p>
  <h3>Records and awards</h3>
  <div class="awards">${H.awards.map(a=>`<div class="award"><div class="k">${esc(a.label)}</div><div class="v">${esc(a.value)}</div><div class="w">${a.who.map(esc).join(", ")}</div></div>`).join("")}</div>
  <h3>Champions</h3>
  ${table([{k:"year",label:"Season",cls:"l",fmt:r=>r.season},{k:"champ",label:"Champion",cls:"l own",asc:true},{k:"champ_rec",label:"Champ record",cls:"c",nosort:true},{k:"runner",label:"Runner-up",cls:"l",asc:true},{k:"third",label:"Third",cls:"l",asc:true},{label:"Best record",cls:"l",nosort:true,fmt:r=>`${r.reg_best.map(esc).join(", ")} (${r.reg_best_rec})`}], H.champs, {sortK:0,dir:-1})}
  <h3>All-time managers</h3>
  ${table([{k:"owner",label:"Manager",cls:"l own",asc:true,fmt:r=>esc(r.owner)+(r.active?"":` <span class="chip">inactive</span>`)},{k:"seasons",label:"Seasons"},{label:"Record",cls:"c",fmt:r=>r.w+"-"+r.l+(r.t?"-"+r.t:""),sort:r=>r.w},{k:"wpct",label:"Win %",fmt:r=>pct(r.wpct)},{k:"titles",label:"Titles"},{k:"seconds",label:"2nd"},{k:"thirds",label:"3rd"},{k:"playoffs",label:"Playoffs"},{k:"po_pct",label:"Playoff %",fmt:r=>Math.round(100*r.po_pct)+"%"},{k:"best_reg",label:"Best record"},{k:"po_streak",label:"Best PO streak"}], H.managers, {sortK:3,dir:-1})}
  <p class="note">Best record counts seasons finishing with the league's top regular season win percentage, ties included.</p>
  <h3>Season by season</h3>
  <div class="tw"><table><thead><tr><th class="l nosort">Manager</th>${yrs.map(y=>`<th class="c nosort">${H.labels[y]}</th>`).join("")}</tr></thead><tbody>
  ${H.managers.map(m=>`<tr><td class="l own">${esc(m.owner)}</td>${yrs.map(y=>{const c=H.grid[m.owner][y]; if(!c) return `<td class="c" style="color:#c9bedb">–</td>`;
      const bg=cf((c.wpct-.5)*2);
      return `<td class="c" style="background:${bg}${c.playoffs?";font-weight:700":""}" title="${esc(m.owner)} ${H.labels[y]}: ${c.rec}${c.playoffs?", made playoffs":""}">${c.rec}${medal(c)}</td>`;}).join("")}</tr>`).join("")}
  </tbody></table></div>
  <div class="legend-key"><span style="--c:#2e9d57">Winning record</span><span style="--c:#d9453d">Losing record</span><span style="--c:var(--gold)">1 Champion</span><span style="--c:#cfc8dc">2 Runner-up</span><span style="--c:#e9a46f">3 Third</span></div>
  <p class="note">Bold records made the playoffs.</p>
  <div class="grid2">
    <div><h3>Best seasons</h3>${table([{k:"owner",label:"Manager",cls:"l own",asc:true},{k:"season",label:"Season",cls:"c"},{k:"rec",label:"Record",cls:"c",sort:r=>r.wpct},{k:"result",label:"Finish",cls:"l"}], H.best)}</div>
    <div><h3>Worst seasons</h3>${table([{k:"owner",label:"Manager",cls:"l own",asc:true},{k:"season",label:"Season",cls:"c"},{k:"rec",label:"Record",cls:"c",sort:r=>r.wpct},{k:"result",label:"Finish",cls:"l"}], H.worst)}</div>
  </div>`;
}

/* ================= RULES ================= */
function rRules(el){
  const P = D.payouts, lead = S[0];
  const regLeader = played?`${esc(lead.owner)} leads at ${rec(lead)} (${f1(lead.pf)} PF)`:"Decided after week "+M.reg_weeks;
  el.innerHTML = `
  <div class="rules">
  <h2 class="pt">Rules</h2>
  <p class="lede">League settings from Yahoo league #86606, plus payouts.</p>
  <h3>Payouts</h3>
  <div class="pay">
    ${P.map(p=>`<div class="panel"><div class="k note" style="margin:0">${esc(p.label)}</div><div class="amt">${money(p.amount)}</div><div class="note">${esc(p.how)}${p.label==="Regular season"?`<br><b style="color:var(--ink)">Now: ${regLeader}</b>`:""}</div></div>`).join("")}
  </div>
  <p class="note">Entry fee ${money(M.fee)} per team, ${money(M.pot)} total. Yahoo plays a third place game; it carries no payout.</p>

  <h3>Scoring</h3>
  <div class="panel"><dl>${D.stat_keys.map(k=>`<dt>${D.stat_labels[k]}</dt><dd>${D.mods[k]>0?"+":""}${D.mods[k]} per ${k==="PTS"?"point":k==="REB"?"rebound":k==="AST"?"assist":k==="ST"?"steal":k==="BLK"?"block":"turnover"}</dd>`).join("")}</dl></div>

  <h3>Format</h3>
  <div class="panel"><dl>
    <dt>Scoring type</dt><dd>Head-to-head points, ${M.teams} teams, no divisions</dd>
    <dt>Regular season</dt><dd>Weeks 1 to ${M.reg_weeks}</dd>
    <dt>Playoffs</dt><dd>${M.playoff_teams} teams, weeks ${M.playoff_weeks.join(" and ")} (ends Sunday, Apr 4), with reseeding and a third place game</dd>
    <dt>Playoff tiebreaker</dt><dd>Best regular season record vs opponent wins</dd>
    <dt>Eliminated teams</dt><dd>Locked</dd>
    <dt>Standings tiebreaker</dt><dd>Points For (used for the regular season prize)</dd>
  </dl></div>

  <h3>Rosters</h3>
  <div class="panel"><dl>
    <dt>Starting lineup</dt><dd>G, G, F, F, C, Util</dd>
    <dt>Bench</dt><dd>1 BN</dd>
    <dt>Injured list</dt><dd>5 IL spots; injured free agents can go straight to IL</dd>
    <dt>Lineup lock</dt><dd>Daily, set by today's games; benched players are not locked</dd>
  </dl></div>

  <h3>Transactions</h3>
  <div class="panel"><dl>
    <dt>Acquisitions</dt><dd>69 per season, 3 per week</dd>
    <dt>Waivers</dt><dd>1 day, continual rolling list, standard mode; post-draft players follow waiver rules</dd>
    <dt>Trades</dt><dd>No limit; commissioner review with a 1 day reject window; deadline March 4, 2027</dd>
    <dt>Draft pick trades</dt><dd>Not allowed</dd>
    <dt>Can't cut list</dt><dd>Yahoo Sports</dd>
  </dl></div>

  <h3>Draft</h3>
  <div class="panel"><dl>
    <dt>Type</dt><dd>Live standard (snake) draft</dd>
    <dt>Date</dt><dd>Thursday, Oct 15, 8:30 PM ET</dd>
    <dt>Pick clock</dt><dd>1 minute, 15 seconds</dd>
  </dl></div>
  </div>`;
}

go();
})();
</script>
</body>
</html>
